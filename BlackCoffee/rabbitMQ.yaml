apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: blackcoffee
spec:
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: blackcoffee
spec:
  ports:
    - port: 5672
      targetPort: 5672
  selector:
    app: rabbitmq