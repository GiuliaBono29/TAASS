server.port=${NOTIFICATION_PORT}

spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2000ms
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000ms
spring.rabbitmq.template.retry.max-interval=3000ms
spring.rabbitmq.template.retry.multiplier=1.5
spring.rabbitmq.template.retry.max-attempts=5