apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: blackcoffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: blackcoffee:auth-service
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: RABBIT_HOST
              value: "rabbitmq"
            - name: SPRING_PROFILES_ACTIVE
              value: "dist"
            - name: DB_SERVICE_NAME
              value: "mysql"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: AUTH_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: blackcoffee 
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080