<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>BlackCoffee - Messaggi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/style_spazi.css">

    <script src="js/apiClient.js"></script>
    <script src="js/messaggi.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/loggedUser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/notification.js"></script>
</head>

<body style="background-color: #F3D3A5;">
    <header class="p-3" style="background-color: #F3D3A5;">
        <div class="container position-relative mt-2 mb-1">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <img src="img/pentafoglio.png" alt="Logo sito" width="50">
                </a>
                <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <img src="img/Black_Coffee.png" alt="Logo sito" width="90">
                </a>

                <div class="d-flex align-items-center ms-auto">
                    <div id="out-button" class="text-end">
                        <a href="login.html" class="btn btn-outline-dark me-2">Login</a>
                        <a href="sign_up.html" class="btn btn-outline-dark me-2">Sign-up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="background-color: #F3D3A5;">

        <div class="search-form-row mb-5 shadow-sm p-4 bg-white rounded">
            <div class="d-flex justify-content-center align-items-center">
                <div class="btn-group w-100" role="group" aria-label="Filtro Messaggi">
                    <input type="radio" class="btn-check" name="filterStatus" id="btnAll" autocomplete="off" checked>
                    <label class="btn btn-outline-dark" for="btnAll">ALL</label>

                    <input type="radio" class="btn-check" name="filterStatus" id="btnPending" autocomplete="off">
                    <label class="btn btn-outline-dark" for="btnPending">PENDING</label>

                    <input type="radio" class="btn-check" name="filterStatus" id="btnAccepted" autocomplete="off">
                    <label class="btn btn-outline-dark" for="btnAccepted">ACCEPTED</label>

                    <input type="radio" class="btn-check" name="filterStatus" id="btnRejected" autocomplete="off">
                    <label class="btn btn-outline-dark" for="btnRejected">REJECTED</label>
                </div>
            </div>
        </div>

        <div id="messagesContainer">
            </div>

    </main>

<footer class="p-3 mt-5" style="background-color: #D9A173; border-top: 2px solid black;">
  <div class="container">
    <div id="footer-nav" class="d-flex justify-content-center align-items-center" style="font-size: 1.1rem;">
    </div>

  <div class="floating-container">
    <button id="btnDeleteMessages" class="btn btn-custom-style shadow align-items-center">
        <i class="bi bi-calendar-check me-2"></i> Cancella Messaggi
    </button>
  </div>
</footer>

</body>
</html>
