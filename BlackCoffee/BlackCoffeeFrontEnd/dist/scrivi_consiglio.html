<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BlackCoffee</title>
  <!--CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--JavaScript -->

  <link rel="stylesheet" href="css/scrivi_consiglio.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
  <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.0/dist/css/coreui.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.0/dist/js/coreui.bundle.min.js"></script>

  <script src="js/apiClient.js"></script>
  <script src="js/scrivi_consiglio.js"></script>
  <script src="js/loggedUser.js"></script>
  <script src="js/footer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="js/notification.js"></script>

</head>

<body style="background-color: #F3D3A5;">
<!--Headers -->
<header class="p-3" style="background-color: #F3D3A5;">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between">

      <!-- Logo -->
      <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
        <img src="/img/pentafoglio.png" alt="Logo sito" width="50">
      </a>
      <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
        <img src="/img/Black_Coffee.png" alt="Logo sito" width="90">
      </a>

      <!-- Ricerca + Accesso -->
      <div class="d-flex align-items-center ms-auto">
        <form class="me-3" role="search">
          <label for="search-input" class="visually-hidden">Ricerca</label>
          <input type="search" id="search-input" class="form-control" placeholder="Ricerca..." aria-label="Search">
        </form>

        <div id="out-button" class="text-end">
          <a href="login.html" class="btn btn-outline-dark me-2">Login</a>
          <a href="sign_up.html" class="btn btn-outline-dark me-2">Sign-up</a>
        </div>
      </div>
    </div>
  </div>
</header>

<!--Main body -->
<main class="container my-5" style="background-color: #F3D3A5;">

  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card shadow-sm p-4" style="background-color: #FFF5E1;">
        <h2 class="mb-4 text-center">Scrivi il tuo Consiglio</h2>

        <form id="formConsigli" method="POST" enctype="multipart/form-data">
          <div class="row mb-3">
            <!-- Titolo -->
            <label for="titolInput" class="col-md-1 col-form-label fw-bold">Titolo</label>
            <div class="col-md-4">
              <input type="text" class="form-control" id="titolInput" name="titolo" placeholder="Inserisci il titolo" required>
            </div>
          </div>

          <div class="row mb-3">
            <!-- Autore -->
            <label for="autore" class="col-md-1 col-form-label fw-bold">Autore</label>
            <div class="col-md-4">
              <input type="text" class="form-control" id="autore" name="autore" placeholder="Inserisci l'autore" required>
            </div>
          </div>

          <!-- Genere -->
          <div class="row mb-3 align-items-center">
            <label for="genere" class="col-md-1 col-form-label fw-bold">Genere</label>
            <div class="col-md-5">
              <select id="genere" name="genere[]" class="selectpicker" multiple data-live-search="true" title="Seleziona i generi">
                <option value="arte">Arte</option>
                <option value="attualità">Attualità</option>
                <option value="biografia">Biografia</option>
                <option value="classico">Classico</option>
                <option value="contemporaneo">Contemporaneo</option>
                <option value="fantascenza">Fantascienza</option>
                <option value="fantascenza-distopico">Fantascienza - Distopico</option>
                <option value="fantascenza-scifi">Fantascienza - Sci-Fi</option>
                <option value="fantasy">Fantasy</option>
                <option value="fantasy-dark">Fantasy - Dark</option>
                <option value="fantasy-epic">Fantasy - Epic</option>
                <option value="fantasy-hurban">Fantasy - Hurban</option>
                <option value="fumetto">Fumetto</option>
                <option value="fumetto-supereroi">Fumetto - Supereroi</option>
                <option value="fumetto-sof">Fumetto - Slice of Life</option>
                <option value="horror">Horror</option>
                <option value="manga">Manga</option>
                <option value="manga-shōnen">Manga - Shōnen</option>
                <option value="manga-seinen">Manga - Seinen</option>
                <option value="manga-shōjo">Manga - Shōjo</option>
                <option value="manga-josei">Manga - Josei</option>
                <option value="romantico">Romance</option>
                <option value="romantico-contemporaneo">Romance - Contemporaneo</option>
                <option value="romantico-storico">Romance - Storico</option>
                <option value="romantico-lgbt">Romance - LGBTQ+</option>
                <option value="romantico-fantasy">Romance - Fantasy</option>
                <option value="romantico-paranormal">Romance - Paranormal</option>
                <option value="saggio">Saggio</option>
                <option value="storico">Storico</option>
                <option value="thriller">Thriller</option>
                <option value="thriller-psicologico">Thriller - Psicologico</option>
                <option value="thriller-noir">Thriller - Noir</option>
                <option value="thriller-truecrime">Thriller - True Crime</option>
                <option value="ya">Young Adult</option>
              </select>
            </div>
          </div>



          <!-- Voto -->
          <div class="row mb-3 align-items-center">
            <label for="voto" class="col-md-1 col-form-label fw-bold">Voto</label>
            <div class="col-md-5 d-flex align-items-center">
              <div id="voto" data-coreui-size="lg" data-coreui-precision="0.5" data-coreui-toggle="rating" data-coreui-value="1"></div>
              <input type="hidden" name="voto" id="voto-input">
            </div>
          </div>

          <!-- Descrizione -->
          <div class="mb-3">
            <label for="descrizione" class="form-label fw-bold">Descrizione</label>
            <textarea class="form-control" id="descrizione" name="descrizione" rows="6" placeholder="Scrivi qui il tuo consiglio..." required></textarea>
          </div>

          <!-- Copertina -->
          <div class="row mb-3">
            <label for="copertina" class="col-md-1 col-form-label fw-bold">Copertina</label>
            <div class="col-md-4">
              <input type="file" id="copertina" name="copertina" accept="image/*" class="form-control">
            </div>
          </div>

          <!-- Pulsante Invia -->
          <div class="text-center">
            <button type="submit" class="btn btn-primary px-5">Pubblica</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</main>


<!--Footer -->
<footer class="p-3 mt-5" style="background-color: #D9A173; border-top: 2px solid black;">
  <div class="container">
    <div id="footer-nav" class="d-flex justify-content-center align-items-center" style="font-size: 1.1rem;">
    </div>
  </div>
</footer>

</body>
</html>
