<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BlackCoffee-ScriviConsiglio</title>
    <!--CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--JavaScript -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.0/dist/css/coreui.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style_reservation.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.0/dist/js/coreui.bundle.min.js"></script>

    <script src="js/apiClient.js"></script>
    <script src="js/modifyReservation.js"></script>
    <script src="js/loggedUser.js"></script>
    <script src="js/footer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/notification.js"></script>

</head>

<body style="background-color: #F3D3A5;">
<!--Headers -->
<header class="p-3" style="background-color: #F3D3A5;">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between">

            <!-- Logo -->
            <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                <img src="img/pentafoglio.png" alt="Logo sito" width="50">
            </a>
            <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                <img src="img/Black_Coffee.png" alt="Logo sito" width="90">
            </a>

            <!-- Ricerca + Accesso -->
            <div class="d-flex align-items-center ms-auto">
                <form class="me-3" role="search">
                    <label for="search-input" class="visually-hidden">Ricerca</label>
                    <input type="search" id="search-input" class="form-control" placeholder="Ricerca..." aria-label="Search">
                </form>

                <div id="out-button" class="text-end">
                    <a href="login.html" class="btn btn-outline-dark me-2">Login</a>
                    <a href="sign_up.html" class="btn btn-outline-dark me-2">Sign-up</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!--Main body -->
<main class="container my-5" style="background-color: #F3D3A5;">

    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card shadow-sm p-4" style="background-color: #FFF5E1;">
                <h2 class="mb-4 text-center">Modifica Prenotazione</h2>

                <form id="formModificaPrenotazione" class="row g-3">

                          <div class="col-md-4">
                                <label for="inputGiorno" class="form-label fw-bold">Giorno</label>
                                <input type="text" class="form-control" id="inputGiorno" name="date">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">Fascia</label>
                                <div class="btn-group-vertical w-100" role="group" aria-label="Fascia">
                                    <input type="radio" class="btn-check" id="mattino" name="slot" value="MATTINO" autocomplete="off">
                                    <label class="btn btn-outline-custom" for="mattino">Mattina</label>
                                    <input type="radio" class="btn-check" id="pomeriggio" name="slot" value="POMERIGGIO" autocomplete="off">
                                    <label class="btn btn-outline-custom" for="pomeriggio">Pomeriggio</label>
                                    <input type="radio" class="btn-check" id="sera" name="slot" value="SERA" autocomplete="off">
                                    <label class="btn btn-outline-custom" for="sera">Sera</label>
                                    <input type="radio" class="btn-check" id="giornata" name="slot" value="GIORNATA" autocomplete="off">
                                    <label class="btn btn-outline-custom" for="giornata">Giornata intera</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="inputPartecipanti" class="form-label fw-bold">Partecipanti</label>
                                <input type="number" class="form-control" id="inputPartecipanti" placeholder="Numero..." name="seats">
                            </div>

                    <!-- Pulsante Invia -->
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary px-5">Pubblica</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</main>


<!--Footer -->
<footer class="p-3 mt-5" style="background-color: #D9A173; border-top: 2px solid black;">
  <div class="container">
    <div id="footer-nav" class="d-flex justify-content-center align-items-center" style="font-size: 1.1rem;">
    </div>
  </div>
</footer>

</body>
</html>
