apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackcoffee-ingress
  namespace: blackcoffee
  annotations:
spec:
  rules: 
    - http:
        paths:
        - path: /api/auth
          pathType: ImplementationSpecific
          backend:
            service:
              name: auth-service
              port:
                number: 8080
        - path: /api/event
          pathType: ImplementationSpecific
          backend:
            service:
              name: event-service
              port:
                number: 8081
        - path: /api/space
          pathType: ImplementationSpecific
          backend:
            service:
              name: space-service
              port:
                number: 8082
        - path: /api/club
          pathType: ImplementationSpecific
          backend:
            service:
              name: club-service
              port:
                number: 8083
        - path: /api/log
          pathType: ImplementationSpecific
          backend:
            service:
              name: log-service
              port:
                number: 8084
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80